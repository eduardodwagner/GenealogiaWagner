<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Genealogy,Genealogía,Wagner,Alemanes del Volga,German from Russia">
    <title>Genealogía de Eduardo Daniel Wagner, Alemanes del Volga</title>
    <style>
        /* Estilos generales */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }

         /* Banner superior */
        .banner-container {
            width: 100%;
            height: 68px; /* Mantiene el tamaño original de tu banner */
            overflow: hidden;
            background-color: white; /* Evita bordes vacíos si la imagen se achica */
        }
        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* CAMBIO: Ahora la imagen se encoge entera sin cortarse */
            object-position: center; /* Mantiene la imagen centrada */
        }

        /* Contenedor principal flexible (Divide menú y contenido) */
        .contenido-web {
            display: flex;
            flex-direction: row; /* En PC se ven uno al lado del otro */
            min-height: calc(100vh - 68px);
        }

        /* Espacio para el menú izquierdo (izquierda.html) */
        .columna-izquierda {
            width: 135px; /* Mantiene el ancho exacto que tenías */
            min-width: 135px;
            border-right: 1px solid #ccc;
            box-sizing: border-box;
        }

        /* Espacio para la página principal (derecha1.html) */
        .columna-derecha {
            flex-grow: 1;
            box-sizing: border-box;
        }

        /* El iframe ahora es moderno y ocupa el 100% de su espacio asignado */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* MÓVILES: Si la pantalla es menor a 768px de ancho, se activa esto automáticamente */
        @media (max-width: 768px) {
            /* CAMBIO OPCIONAL: Si el banner queda muy bajito en celular, puedes cambiar el alto aquí */
            .banner-container {
                height: auto; /* Permite que el banner adapte su altura proporcionalmente en el celular */
            }
            .banner-container img {
                height: auto;
            }
            
            .contenido-web {
                flex-direction: column; /* En celular se apilan: menú arriba, contenido abajo */
                min-height: auto;
            }
            .columna-izquierda {
                width: 100%; /* El menú ocupa todo el ancho en el celular */
                height: 150px; /* Le asignamos un alto fijo al menú para que no colapse */
                border-right: none;
                border-bottom: 1px solid #ccc;
            }
            .columna-derecha {
                width: 100%;
                height: 60vh; /* Le damos una altura cómoda al contenido en celulares */
            }
        }
    </style>
</head>
<body>

    <!-- Banner Superior -->
    <div class="banner-container">
        <img src="bann.jpg" alt="Banner Genealogía Wagner">
    </div>

    <!-- Contenedor Flexible -->
    <div class="contenido-web">
        
        <!-- Columna Izquierda (Menú) -->
        <div class="columna-izquierda">
            <iframe src="izquierda.html" name="menu"></iframe>
        </div>

        <!-- Columna Derecha (Contenido principal) -->
        <div class="columna-derecha">
            <iframe src="derecha1.html" name="principal"></iframe>
        </div>

    </div>

</body>
</html>
